name: Build APK

# 触发方式：
# 1. 推送到 main 分支
# 2. 仓库页面 Actions 标签页里手动 Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android shell & fetch deps
        run: |
          flutter create . --platforms android --project-name workbench_app --no-pub
          python3 tools/setup_android.py
          flutter pub get

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          code=$?
          tail -120 build.log
          exit $code

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workbench-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
